<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>📋 MBALA Education Data</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js">
    </script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #f0f4fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .app-container {
            max-width: 480px;
            width: 100%;
            background: white;
            border-radius: 36px 36px 24px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            margin: 0 auto;
        }
        .app-header {
            background: #1a2b4a;
            padding: 16px 18px 12px 18px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2c3e5e;
        }
        .app-header h1 {
            font-size: 17px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-header h1 i {
            color: #ffcd3c;
            font-size: 20px;
        }
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .header-actions .admin-badge {
            background: #2a3f62;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 500;
            color: #b8d0f0;
            border: 1px solid #3b557a;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-actions .admin-badge:hover {
            background: #3b557a;
        }
        .header-actions .admin-badge i {
            font-size: 12px;
        }
        .app-content {
            padding: 16px 14px 20px;
            background: white;
        }
        .tabs {
            display: flex;
            background: #eef2f7;
            border-radius: 40px;
            padding: 4px;
            margin-bottom: 18px;
            border: 1px solid #dce2ec;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 9px 6px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 12px;
            color: #3a4b66;
            cursor: pointer;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .tab.active {
            background: #1a2b4a;
            color: white;
            box-shadow: 0 4px 8px rgba(0, 20, 40, 0.15);
        }
        .section {
            display: block;
        }
        .section.hidden {
            display: none;
        }
        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #0b1a30;
            margin-bottom: 14px;
            border-left: 4px solid #1a2b4a;
            padding-left: 12px;
        }
        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .field label {
            font-size: 12px;
            font-weight: 600;
            color: #2c405e;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .field label i {
            color: #1a2b4a;
            width: 16px;
            font-size: 13px;
        }
        .field input,
        .field select {
            background: #f8faff;
            border: 1px solid #d7dfe9;
            border-radius: 16px;
            padding: 12px 14px;
            font-size: 14px;
            outline: none;
            width: 100%;
            color: #1e2f47;
        }
        .field input:focus,
        .field select:focus {
            border-color: #1a2b4a;
            background: white;
            box-shadow: 0 0 0 3px rgba(26, 43, 74, 0.08);
        }
        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .btn {
            background: #1a2b4a;
            border: none;
            padding: 14px 18px;
            border-radius: 60px;
            color: white;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-top: 16px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #2a3f62;
        }
        .btn:active {
            transform: scale(0.97);
            background: #12223a;
        }
        .btn-success {
            background: #0f7b3a;
            border-color: #0f7b3a;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #1a2b4a;
            color: #1a2b4a;
        }
        .btn-danger {
            background: #b03a2e;
            border-color: #b03a2e;
        }
        .btn-warning {
            background: #d4a017;
            border-color: #d4a017;
        }
        .toast {
            background: #1e2f47;
            color: white;
            padding: 10px 16px;
            border-radius: 60px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            margin-top: 14px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .toast i {
            color: #ffcd3c;
        }
        .toast.error i {
            color: #e74c3c;
        }
        .footer-note {
            font-size: 11px;
            color: #7a8fa8;
            text-align: center;
            margin-top: 14px;
            border-top: 1px solid #e5ebf3;
            padding-top: 14px;
        }
        .admin-login-area {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .admin-login-area input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 40px;
            border: 1px solid #d7dfe9;
            background: #f8faff;
            outline: none;
        }
        .admin-login-area input:focus {
            border-color: #1a2b4a;
        }
        .admin-list {
            max-height: 460px;
            overflow-y: auto;
            background: #f8faff;
            border-radius: 20px;
            padding: 8px 4px;
            border: 1px solid #e5ebf3;
        }
        .admin-item {
            background: white;
            border-radius: 16px;
            padding: 12px 14px;
            margin-bottom: 8px;
            border: 1px solid #e5ebf3;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }
        .admin-item .top-row {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #0b1a30;
        }
        .admin-item .top-row .school-type {
            font-size: 11px;
            background: #eef2f7;
            padding: 2px 10px;
            border-radius: 40px;
            font-weight: 500;
        }
        .admin-item .details {
            font-size: 12px;
            color: #3a4b66;
            margin-top: 6px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        .admin-item .timestamp {
            font-size: 10px;
            color: #7a8fa8;
            margin-top: 6px;
            border-top: 1px solid #f0f4fa;
            padding-top: 4px;
        }
        .admin-actions {
            display: flex;
            gap: 8px;
            margin: 10px 0 6px;
            flex-wrap: wrap;
        }
        .admin-actions .btn {
            width: auto;
            padding: 8px 18px;
            font-size: 13px;
            margin: 0;
            flex: 1;
            min-width: 80px;
        }
        .setup-box {
            background: #fff8e1;
            border: 2px solid #ffb300;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .setup-box h4 {
            color: #e65100;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .setup-box .field {
            margin-bottom: 8px;
        }
        .setup-box .field input {
            font-size: 12px;
            padding: 8px 12px;
        }
        .admin-panel {
            background: white;
            padding: 16px 14px 20px;
            border-top: 2px solid #1a2b4a;
        }
        .admin-panel.hidden {
            display: none;
        }
        .login-error {
            color: #c62828;
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
            display: none;
        }
        .login-error.show {
            display: block;
        }
        .sub-section-title {
            font-size: 13px;
            font-weight: 600;
            color: #0b1a30;
            margin: 8px 0 6px 0;
            padding-left: 8px;
            border-left: 3px solid #ffcd3c;
        }
        .label-hint {
            font-size: 10px;
            color: #7a8fa8;
            font-weight: 400;
        }
        @media (max-width: 480px) {
            .row-2 {
                grid-template-columns: 1fr;
            }
            .row-3 {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">
        <div class="app-header">
            <h1><i class="fas fa-graduation-cap"></i> MBALA 2025</h1>
            <div class="header-actions">
                <span class="admin-badge" id="adminHeaderBtn"><i class="fas fa-user-shield"></i> Admin</span>
            </div>
        </div>
        <div class="app-content">
            <div class="tabs" id="tabContainer">
                <button class="tab active" data-tab="primaryTab"><i class="fas fa-chalkboard-teacher"></i> Primary</button>
                <button class="tab" data-tab="secondaryTab"><i class="fas fa-school"></i> Secondary</button>
            </div>

            <!-- SETUP -->
            <div id="setupBox" class="setup-box">
                <h4><i class="fas fa-cog"></i> Supabase Configuration</h4>
                <p style="font-size:12px; color:#5d4037; margin-bottom:12px;">Enter your Supabase project URL and anonymous key.</p>
                <div class="field">
                    <label><i class="fas fa-link"></i> Supabase URL</label>
                    <input type="text" id="supabaseUrlInput" placeholder="https://your-project.supabase.co">
                </div>
                <div class="field">
                    <label><i class="fas fa-key"></i> Anon Key</label>
                    <input type="text" id="supabaseKeyInput" placeholder="Your anon/public key">
                </div>
                <button id="saveConfigBtn" class="btn btn-warning" style="margin-top:8px; padding:10px;"><i class="fas fa-save"></i> Connect</button>
                <div id="configStatus" style="font-size:12px; margin-top:8px; color:#2e7d32;"></div>
            </div>

            <!-- PRIMARY FORM -->
            <div id="primaryTab" class="section">
                <div class="section-title"><i class="fas fa-edit"></i> Primary School Data</div>
                <div class="form-grid" id="primaryForm">
                    <div class="field"><label><i class="fas fa-tag"></i> School Name</label><input type="text" id="priName" placeholder="e.g. Mbala Central"></div>
                    <div class="row-2">
                        <div class="field"><label><i class="fas fa-map-pin"></i> Status</label>
                            <select id="priStatus"><option value="Urban">Urban</option><option value="Rural" selected>Rural</option><option value="Remote">Remote</option></select>
                        </div>
                        <div class="field"><label><i class="fas fa-road"></i> Distance (km)</label><input type="number" id="priDist" value="12"></div>
                    </div>
                    <div class="row-2">
                        <div class="field"><label><i class="fas fa-hashtag"></i> EMIS</label><input type="text" id="priEmis" value="EMIS-001"></div>
                        <div class="field"><label><i class="fas fa-home"></i> Staff Houses</label>
                            <div class="row-3">
                                <input type="number" id="priPermHouses" placeholder="Perm" value="4">
                                <input type="number" id="priIncompHouses" placeholder="Incomp" value="2">
                                <input type="number" id="priTempHouses" placeholder="Temp" value="1">
                            </div>
                        </div>
                    </div>
                    <div class="field"><label><i class="fas fa-door-open"></i> Classrooms</label>
                        <div class="row-3">
                            <input type="number" id="priPermClass" placeholder="Permanent" value="8">
                            <input type="number" id="priIncompClass" placeholder="Incomplete" value="2">
                            <input type="number" id="priTempClass" placeholder="Temporal" value="1">
                        </div>
                    </div>
                    <div class="row-2">
                        <div class="field"><label><i class="fas fa-chair"></i> Desks Available</label><input type="number" id="priDesks" value="120"></div>
                        <div class="field"><label><i class="fas fa-chair"></i> Shortfall</label><input type="number" id="priDeskShort" value="15"></div>
                    </div>

                    <div class="sub-section-title"><i class="fas fa-users"></i> Enrolment (Boys / Girls)</div>
                    <div class="row-2">
                        <div class="field"><label>ECE Level 1</label><input type="text" id="priEce1" placeholder="e.g. 15/12" value="15/12"></div>
                        <div class="field"><label>ECE Level 2</label><input type="text" id="priEce2" placeholder="e.g. 18/16" value="18/16"></div>
                    </div>
                    <div class="row-2">
                        <div class="field"><label>Grade 1</label><input type="text" id="priG1" placeholder="e.g. 30/28" value="30/28"></div>
                        <div class="field"><label>Grade 2 - 7</label><input type="text" id="priG2_7" placeholder="e.g. 120/115" value="120/115"></div>
                    </div>
                    <div class="row-2">
                        <div class="field"><label>Grade 8 - 9</label><input type="text" id="priG8_9" placeholder="e.g. 45/40" value="45/40"></div>
                    </div>

                    <div class="sub-section-title"><i class="fas fa-user-tie"></i> Teachers</div>
                    <div class="row-2">
                        <div class="field"><label>Male</label><input type="number" id="priMale" value="12"></div>
                        <div class="field"><label>Female</label><input type="number" id="priFemale" value="8"></div>
                    </div>
                    <div class="row-2">
                        <div class="field"><label>Total</label><input type="number" id="priTotalTeachers" value="20"></div>
                        <div class="field"><label>Shortfall</label><input type="number" id="priTeacherShort" value="2"></div>
                    </div>

                    <div class="row-2">
                        <div class="field"><label><i class="fas fa-laptop"></i> Computers Functional</label><input type="number" id="priCompFunc" value="6"></div>
                        <div class="field"><label><i class="fas fa-laptop"></i> Dysfunctional</label><input type="number" id="priCompDys" value="2"></div>
                    </div>

                    <div class="row-2">
                        <div class="field"><label><i class="fas fa-bolt"></i> Power Source</label>
                            <select id="priPower"><option value="HEP">HEP</option><option value="Solar">Solar</option><option value="Non">Non</option></select>
                        </div>
                        <div class="field"><label><i class="fas fa-tint"></i> Water Source</label>
                            <select id="priWater">
                                <option value="Piped">Piped</option>
                                <option value="Mechanised Borehole">Mechanised Borehole</option>
                                <option value="Hand Pump Borehole">Hand Pump Borehole</option>
                                <option value="Well">Well</option>
                                <option value="Stream">Stream</option>
                                <option value="Water Borne">Water Borne</option>
                            </select>
                        </div>
                    </div>

                    <div class="field"><label><i class="fas fa-restroom"></i> Toilets</label>
                        <div class="row-3">
                            <input type="number" id="priVip" placeholder="Double VIP" value="4">
                            <input type="number" id="priSingleVip" placeholder="Single VIP" value="6">
                            <input type="number" id="priPit" placeholder="Pit Latrines" value="2">
                        </div>
                    </div>

                    <div class="field"><label><i class="fas fa-signal"></i> Mobile Network</label>
                        <select id="priMobile">
                            <option value="Airtel, MTN, Zamtel">Airtel, MTN, Zamtel</option>
                            <option value="Airtel">Airtel</option>
                            <option value="MTN">MTN</option>
                            <option value="Zamtel">Zamtel</option>
                        </select>
                    </div>

                    <div class="field"><label><i class="fas fa-user-graduate"></i> Specialization Teaching</label>
                        <input type="text" id="priSpecialization" placeholder="e.g. Grade 1-4" value="Grade 1-4">
                    </div>

                    <div class="field"><label><i class="fas fa-user-graduate"></i> Teacher Sample</label>
                        <input type="text" id="priTeacherSample" placeholder="Name – Role" value="Mwansa K. – HEADTEACHER">
                    </div>

                    <button class="btn btn-success" data-type="primary"><i class="fas fa-cloud-upload-alt"></i> Submit Primary</button>
                </div>
            </div>

            <!-- SECONDARY FORM -->
            <div id="secondaryTab" class="section hidden">
                <div class="section-title"><i class="fas fa-school"></i> Secondary School Data</div>
                <div class="form-grid" id="secondaryForm">
                    <div class="field"><label><i class="fas fa-tag"></i> School Name</label><input type="text" id="secName" placeholder="e.g. Mbala Secondary"></div>
                    <div class="row-2">
                        <div class="field"><label><i class="fas fa-map-pin"></i> Status</label>
                            <select id="secStatus"><option value="Urban">Urban</option><option value="Rural" selected>Rural</option><option value="Remote">Remote</option></select>
                        </div>
                        <div class="field"><label><i class="fas fa-road"></i> Distance (km)</label><input type="number" id="secDist" value="8"></div>
                    </div>
                    <div class="row-2">
                        <div class="field"><label><i class="fas fa-hashtag"></i> EMIS</label><input type="text" id="secEmis" value="EMIS-201"></div>
                        <div class="field"><label><i class="fas fa-home"></i> Staff Houses</label>
                            <div class="row-3">
                                <input type="number" id="secPermHouses" placeholder="Perm" value="6">
                                <input type="number" id="secIncompHouses" placeholder="Incomp" value="3">
                                <input type="number" id="secTempHouses" placeholder="Temp" value="1">
                            </div>
                        </div>
                    </div>
                    <div class="field"><label><i class="fas fa-door-open"></i> Classrooms</label>
                        <div class="row-3">
                            <input type="number" id="secPermClass" placeholder="Permanent" value="12">
                            <input type="number" id="secIncompClass" placeholder="Incomplete" value="2">
                            <input type="number" id="secTempClass" placeholder="Temporal" value="1">
                        </div>
                    </div>
                    <div class="row-2">
                        <div class="field"><label><i class="fas fa-chair"></i> Desks Available</label><input type="number" id="secDesks" value="200"></div>
                        <div class="field"><label><i class="fas fa-chair"></i> Shortfall</label><input type="number" id="secDeskShort" value="22"></div>
                    </div>

                    <div class="sub-section-title"><i class="fas fa-users"></i> Enrolment (Boys / Girls)</div>
                    <div class="row-2">
                        <div class="field"><label>Form 1</label><input type="text" id="secF1" placeholder="e.g. 60/55" value="60/55"></div>
                        <div class="field"><label>Grade 9</label><input type="text" id="secG9" placeholder="e.g. 50/48" value="50/48"></div>
                    </div>
                    <div class="row-2">
                        <div class="field"><label>Grade 10 - 12</label><input type="text" id="secG10_12" placeholder="e.g. 90/85" value="90/85"></div>
                    </div>

                    <div class="sub-section-title"><i class="fas fa-user-tie"></i> Teachers</div>
                    <div class="row-2">
                        <div class="field"><label>Male</label><input type="number" id="secMale" value="18"></div>
                        <div class="field"><label>Female</label><input type="number" id="secFemale" value="8"></div>
                    </div>
                    <div class="row-2">
                        <div class="field"><label>Total</label><input type="number" id="secTotalTeachers" value="26"></div>
                        <div class="field"><label>Shortfall</label><input type="number" id="secTeacherShort" value="4"></div>
                    </div>

                    <div class="row-2">
                        <div class="field"><label><i class="fas fa-laptop"></i> Computers Functional</label><input type="number" id="secCompFunc" value="15"></div>
                        <div class="field"><label><i class="fas fa-laptop"></i> Dysfunctional</label><input type="number" id="secCompDys" value="3"></div>
                    </div>

                    <div class="field"><label><i class="fas fa-tint"></i> Water Source</label>
                        <select id="secWater">
                            <option value="Piped">Piped</option>
                            <option value="Mechanised Borehole" selected>Mechanised Borehole</option>
                            <option value="Hand Pump Borehole">Hand Pump Borehole</option>
                            <option value="Well">Well</option>
                            <option value="Stream">Stream</option>
                            <option value="Water Borne">Water Borne</option>
                        </select>
                    </div>

                    <div class="field"><label><i class="fas fa-restroom"></i> Toilets</label>
                        <div class="row-3">
                            <input type="number" id="secVip" placeholder="Double VIP" value="6">
                            <input type="number" id="secSingleVip" placeholder="Single VIP" value="8">
                            <input type="number" id="secPit" placeholder="Pit Latrines" value="4">
                        </div>
                    </div>

                    <div class="field"><label><i class="fas fa-signal"></i> Mobile Network</label>
                        <select id="secMobile">
                            <option value="Airtel, MTN, Zamtel">Airtel, MTN, Zamtel</option>
                            <option value="Airtel">Airtel</option>
                            <option value="MTN">MTN</option>
                            <option value="Zamtel">Zamtel</option>
                        </select>
                    </div>

                    <div class="field"><label><i class="fas fa-user-graduate"></i> Teacher Sample</label>
                        <input type="text" id="secTeacherSample" placeholder="Name – Role" value="B. Chanda – HEADTEACHER">
                    </div>

                    <button class="btn btn-success" data-type="secondary"><i class="fas fa-cloud-upload-alt"></i> Submit Secondary</button>
                </div>
            </div>

            <div id="globalToast" class="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg">Saved!</span></div>
            <div class="footer-note"><i class="fas fa-database"></i> Supabase · MBALA 2025</div>
        </div>

        <!-- ADMIN PANEL -->
        <div id="adminPanel" class="admin-panel hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <span class="section-title" style="margin:0;"><i class="fas fa-lock"></i> Admin Dashboard</span>
                <button id="closeAdminBtn" class="btn" style="width:auto; padding:6px 16px; margin:0; font-size:13px; background:#b03a2e; border-color:#b03a2e;"><i class="fas fa-times"></i></button>
            </div>
            <div id="adminLoginSection">
                <div class="admin-login-area">
                    <input type="password" id="adminPass" placeholder="Enter admin password">
                    <button id="adminLoginBtn" class="btn" style="width:auto; padding:8px 18px; margin:0;"><i class="fas fa-sign-in-alt"></i> Login</button>
                </div>
                <div id="loginError" class="login-error">❌ Incorrect password</div>
            </div>
            <div id="adminContent" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <span style="font-size:13px; color:#2e7d32;"><i class="fas fa-check-circle"></i> Logged in</span>
                    <button id="adminLogoutBtn" class="btn" style="width:auto; padding:4px 14px; margin:0; font-size:12px; background:#b03a2e; border-color:#b03a2e;"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
                <div class="admin-actions">
                    <button id="refreshAdminBtn" class="btn btn-outline"><i class="fas fa-sync-alt"></i> Refresh</button>
                    <button id="exportExcelBtn" class="btn" style="background:#1a2b4a;"><i class="fas fa-file-excel"></i> Excel</button>
                </div>
                <div id="adminList" class="admin-list">
                    <p style="color:#7a8fa8; text-align:center; padding:20px 0;">Loading data...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            let SUPABASE_URL = localStorage.getItem('supabase_url') || '';
            let SUPABASE_ANON_KEY = localStorage.getItem('supabase_anon_key') || '';
            let supabaseClient = null;
            let isLoggedIn = false;

            // DOM refs
            const setupBox = document.getElementById('setupBox');
            const supabaseUrlInput = document.getElementById('supabaseUrlInput');
            const supabaseKeyInput = document.getElementById('supabaseKeyInput');
            const saveConfigBtn = document.getElementById('saveConfigBtn');
            const configStatus = document.getElementById('configStatus');
            const primaryTab = document.getElementById('primaryTab');
            const secondaryTab = document.getElementById('secondaryTab');
            const tabBtns = document.querySelectorAll('.tab');
            const adminHeaderBtn = document.getElementById('adminHeaderBtn');
            const adminPanel = document.getElementById('adminPanel');
            const closeAdminBtn = document.getElementById('closeAdminBtn');
            const adminPassInput = document.getElementById('adminPass');
            const adminLoginBtn = document.getElementById('adminLoginBtn');
            const adminLoginSection = document.getElementById('adminLoginSection');
            const adminContent = document.getElementById('adminContent');
            const adminList = document.getElementById('adminList');
            const refreshBtn = document.getElementById('refreshAdminBtn');
            const exportExcelBtn = document.getElementById('exportExcelBtn');
            const loginError = document.getElementById('loginError');
            const adminLogoutBtn = document.getElementById('adminLogoutBtn');
            const toastDiv = document.getElementById('globalToast');
            const toastMsg = document.getElementById('toastMsg');

            if (SUPABASE_URL) supabaseUrlInput.value = SUPABASE_URL;
            if (SUPABASE_ANON_KEY) supabaseKeyInput.value = SUPABASE_ANON_KEY;

            function initSupabase() {
                if (SUPABASE_URL && SUPABASE_ANON_KEY) {
                    try {
                        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                        setupBox.style.display = 'none';
                        configStatus.textContent = '✅ Connected';
                        configStatus.style.color = '#2e7d32';
                        return true;
                    } catch (e) {
                        configStatus.textContent = '❌ Error: ' + e.message;
                        configStatus.style.color = '#c62828';
                        return false;
                    }
                } else {
                    setupBox.style.display = 'block';
                    configStatus.textContent = '⚠️ Enter credentials';
                    configStatus.style.color = '#e65100';
                    return false;
                }
            }

            saveConfigBtn.addEventListener('click', function() {
                const url = supabaseUrlInput.value.trim();
                const key = supabaseKeyInput.value.trim();
                if (!url || !key) {
                    configStatus.textContent = '❌ Enter both URL and Key';
                    configStatus.style.color = '#c62828';
                    return;
                }
                localStorage.setItem('supabase_url', url);
                localStorage.setItem('supabase_anon_key', key);
                SUPABASE_URL = url;
                SUPABASE_ANON_KEY = key;
                if (initSupabase()) {
                    showToast('✅ Connected!');
                }
            });

            function switchTab(tabId) {
                tabBtns.forEach(t => t.classList.remove('active'));
                document.querySelector(`.tab[data-tab="${tabId}"]`).classList.add('active');
                if (tabId === 'primaryTab') {
                    primaryTab.classList.remove('hidden');
                    secondaryTab.classList.add('hidden');
                } else {
                    secondaryTab.classList.remove('hidden');
                    primaryTab.classList.add('hidden');
                }
            }
            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    switchTab(this.dataset.tab);
                });
            });

            adminHeaderBtn.addEventListener('click', function() {
                if (adminPanel.classList.contains('hidden')) {
                    adminPanel.classList.remove('hidden');
                    if (isLoggedIn) {
                        adminLoginSection.style.display = 'none';
                        adminContent.style.display = 'block';
                        loadAdminData();
                    } else {
                        adminLoginSection.style.display = 'block';
                        adminContent.style.display = 'none';
                        adminPassInput.value = '';
                        loginError.classList.remove('show');
                        adminPassInput.focus();
                    }
                } else {
                    adminPanel.classList.add('hidden');
                }
            });

            closeAdminBtn.addEventListener('click', function() {
                adminPanel.classList.add('hidden');
            });

            const ADMIN_PASSWORD = 'mbala2025';
            let loginAttempts = 0;

            adminLoginBtn.addEventListener('click', function() {
                const pass = adminPassInput.value.trim();
                if (pass === ADMIN_PASSWORD) {
                    isLoggedIn = true;
                    loginError.classList.remove('show');
                    adminLoginSection.style.display = 'none';
                    adminContent.style.display = 'block';
                    loadAdminData();
                    showToast('✅ Admin access granted');
                    adminPassInput.value = '';
                    loginAttempts = 0;
                } else {
                    loginAttempts++;
                    loginError.classList.add('show');
                    adminPassInput.value = '';
                    adminPassInput.focus();
                    if (loginAttempts >= 3) {
                        showToast('❌ Too many failed attempts');
                        loginAttempts = 0;
                    }
                }
            });

            adminPassInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') adminLoginBtn.click();
            });

            adminLogoutBtn.addEventListener('click', function() {
                isLoggedIn = false;
                adminLoginSection.style.display = 'block';
                adminContent.style.display = 'none';
                adminPassInput.value = '';
                loginError.classList.remove('show');
                showToast('🔒 Logged out');
            });

            async function loadAdminData() {
                if (!isLoggedIn) {
                    adminList.innerHTML = '<p style="color:#c62828; text-align:center; padding:20px 0;">🔒 Please login</p>';
                    return;
                }
                if (!supabaseClient) {
                    if (!initSupabase()) {
                        adminList.innerHTML = '<p style="color:#c62828; text-align:center; padding:20px 0;">⚠️ Configure Supabase</p>';
                        return;
                    }
                }
                try {
                    adminList.innerHTML = '<p style="color:#7a8fa8; text-align:center; padding:20px 0;">Loading...</p>';
                    const { data, error } = await supabaseClient
                        .from('schools_data')
                        .select('*')
                        .order('created_at', { ascending: false });
                    if (error) throw error;
                    if (!data || data.length === 0) {
                        adminList.innerHTML = '<p style="color:#7a8fa8; text-align:center; padding:20px 0;">📭 No submissions</p>';
                        return;
                    }
                    let html = '';
                    data.forEach((row) => {
                        const type = row.school_type || 'primary';
                        const typeLabel = type === 'primary' ? '🏫 Primary' : '🏛️ Secondary';
                        html += `<div class="admin-item">
                            <div class="top-row">
                                <span><i class="fas fa-school" style="margin-right:6px;"></i>${row.school_name || 'N/A'}</span>
                                <span class="school-type">${typeLabel}</span>
                            </div>
                            <div class="details">
                                <span><i class="fas fa-map-pin"></i> ${row.status || '-'}</span>
                                <span><i class="fas fa-road"></i> ${row.distance || '-'} km</span>
                                <span><i class="fas fa-hashtag"></i> ${row.emis || '-'}</span>
                                <span><i class="fas fa-users"></i> M/F: ${row.male_teachers || 0}/${row.female_teachers || 0}</span>
                                <span><i class="fas fa-chair"></i> Desks: ${row.desks || 0}</span>
                                <span><i class="fas fa-tint"></i> ${row.water || '-'}</span>
                            </div>
                            <div class="timestamp">
                                <i class="far fa-calendar-alt"></i> ${row.created_at ? new Date(row.created_at).toLocaleString() : ''}
                            </div>
                        </div>`;
                    });
                    adminList.innerHTML = html;
                } catch (err) {
                    adminList.innerHTML = `<p style="color:#c62828; text-align:center; padding:20px 0;">⚠️ ${err.message}</p>`;
                    console.error(err);
                }
            }

            refreshBtn.addEventListener('click', function() {
                if (isLoggedIn) {
                    loadAdminData();
                } else {
                    showToast('🔒 Please login first');
                }
            });

            // EXPORT EXCEL WITH TWO SHEETS
            exportExcelBtn.addEventListener('click', async function() {
                if (!isLoggedIn) {
                    showToast('🔒 Please login first');
                    return;
                }
                if (!supabaseClient) {
                    if (!initSupabase()) {
                        showToast('⚠️ Configure Supabase first');
                        return;
                    }
                }
                try {
                    const { data, error } = await supabaseClient.from('schools_data').select('*').order('created_at', {
                        ascending: false
                    });
                    if (error) throw error;
                    if (!data || data.length === 0) { showToast('No data to export'); return; }

                    const primaryData = data.filter(row => row.school_type === 'primary');
                    const secondaryData = data.filter(row => row.school_type === 'secondary');

                    const wb = XLSX.utils.book_new();

                    // PRIMARY SHEET
                    if (primaryData.length > 0) {
                        const primaryHeaders = [
                            'S/NO', 'DISTRICT', 'SCHOOL NAME', 'STATUS', 'DISTANCE', 'EMIS',
                            'PERM HOUSES', 'INCOMP HOUSES', 'TEMP HOUSES',
                            'PERM CLASS', 'INCOMP CLASS', 'TEMP CLASS',
                            'DESKS', 'SHORTFALL',
                            'ECE1 BOYS', 'ECE1 GIRLS', 'ECE2 BOYS', 'ECE2 GIRLS',
                            'GRADE1 BOYS', 'GRADE1 GIRLS', 'GRADE2-7 BOYS', 'GRADE2-7 GIRLS',
                            'GRADE8-9 BOYS', 'GRADE8-9 GIRLS',
                            'MALE TEACHERS', 'FEMALE TEACHERS', 'TOTAL TEACHERS', 'SHORTFALL',
                            'COMP FUNC', 'COMP DYS',
                            'POWER', 'WATER',
                            'DOUBLE VIP', 'SINGLE VIP', 'PIT LATRINES',
                            'MOBILE', 'SPECIALIZATION', 'TEACHER SAMPLE'
                        ];

                        const primaryRows = primaryData.map((row, index) => {
                            const parseEnr = (str) => {
                                if (!str) return [0, 0];
                                const parts = str.split('/');
                                return [parseInt(parts[0]) || 0, parseInt(parts[1]) || 0];
                            };
                            const e1 = parseEnr(row.ece1);
                            const e2 = parseEnr(row.ece2);
                            const g1 = parseEnr(row.grade1);
                            const g27 = parseEnr(row.grade2_7);
                            const g89 = parseEnr(row.grade8_9);

                            return [
                                index + 1, 'MBALA', row.school_name || '', row.status || '', row.distance || 0, row
                                .emis || '',
                                row.perm_houses || 0, row.incomp_houses || 0, row.temp_houses || 0,
                                row.perm_class || 0, row.incomp_class || 0, row.temp_class || 0,
                                row.desks || 0, row.desk_shortfall || 0,
                                e1[0], e1[1], e2[0], e2[1],
                                g1[0], g1[1], g27[0], g27[1],
                                g89[0], g89[1],
                                row.male_teachers || 0, row.female_teachers || 0, row.total_teachers || 0, row
                                .teacher_shortfall || 0,
                                row.comp_func || 0, row.comp_dys || 0,
                                row.power || '', row.water || '',
                                row.vip_latrines || 0, row.single_vip || 0, row.pit_latrines || 0,
                                row.mobile_network || '', row.specialization || '', row.teacher_sample || ''
                            ];
                        });

                        // Add totals for primary
                        const totalRow = ['TOTALS', '', '', '', '', ''];
                        const numCols = [6, 7, 8, 9, 10, 11, 12, 13, 24, 25, 26, 27, 28, 29, 32, 33, 34];
                        numCols.forEach(idx => {
                            let sum = 0;
                            primaryRows.forEach(row => {
                                const val = row[idx];
                                if (typeof val === 'number') sum += val;
                            });
                            totalRow[idx] = sum;
                        });

                        const wsData = [
                            ['MBALA DISTRICT EDUCATION BOARD'],
                            ['DATA ON PRIMARY SCHOOLS AND TEACHERS - 2025'],
                            [''],
                            primaryHeaders,
                            ...primaryRows,
                            totalRow
                        ];

                        const ws = XLSX.utils.aoa_to_sheet(wsData);
                        ws['!cols'] = primaryHeaders.map((h, i) => {
                            let width = 12;
                            if (i < 3) width = 20;
                            if (i > 30) width = 18;
                            return { wch: width };
                        });
                        ws['!merges'] = [
                            { s: { r: 0, c: 0 }, e: { r: 0, c: primaryHeaders.length - 1 } },
                            { s: { r: 1, c: 0 }, e: { r: 1, c: primaryHeaders.length - 1 } }
                        ];
                        XLSX.utils.book_append_sheet(wb, ws, 'Primary Schools');
                    }

                    // SECONDARY SHEET
                    if (secondaryData.length > 0) {
                        const secondaryHeaders = [
                            'S/NO', 'DISTRICT', 'SCHOOL NAME', 'STATUS', 'DISTANCE', 'EMIS',
                            'PERM HOUSES', 'INCOMP HOUSES', 'TEMP HOUSES',
                            'PERM CLASS', 'INCOMP CLASS', 'TEMP CLASS',
                            'DESKS', 'SHORTFALL',
                            'FORM1 BOYS', 'FORM1 GIRLS', 'GRADE9 BOYS', 'GRADE9 GIRLS',
                            'GRADE10-12 BOYS', 'GRADE10-12 GIRLS',
                            'MALE TEACHERS', 'FEMALE TEACHERS', 'TOTAL TEACHERS', 'SHORTFALL',
                            'COMP FUNC', 'COMP DYS',
                            'WATER',
                            'DOUBLE VIP', 'SINGLE VIP', 'PIT LATRINES',
                            'MOBILE', 'TEACHER SAMPLE'
                        ];

                        const secondaryRows = secondaryData.map((row, index) => {
                            const parseEnr = (str) => {
                                if (!str) return [0, 0];
                                const parts = str.split('/');
                                return [parseInt(parts[0]) || 0, parseInt(parts[1]) || 0];
                            };
                            const f1 = parseEnr(row.form1);
                            const g9 = parseEnr(row.grade9);
                            const g10 = parseEnr(row.grade10_12);

                            return [
                                index + 1, 'MBALA', row.school_name || '', row.status || '', row.distance || 0, row
                                .emis || '',
                                row.perm_houses || 0, row.incomp_houses || 0, row.temp_houses || 0,
                                row.perm_class || 0, row.incomp_class || 0, row.temp_class || 0,
                                row.desks || 0, row.desk_shortfall || 0,
                                f1[0], f1[1], g9[0], g9[1],
                                g10[0], g10[1],
                                row.male_teachers || 0, row.female_teachers || 0, row.total_teachers || 0, row
                                .teacher_shortfall || 0,
                                row.comp_func || 0, row.comp_dys || 0,
                                row.water || '',
                                row.vip_latrines || 0, row.single_vip || 0, row.pit_latrines || 0,
                                row.mobile_network || '', row.teacher_sample || ''
                            ];
                        });

                        // Add totals for secondary
                        const totalRow = ['TOTALS', '', '', '', '', ''];
                        const numCols = [6, 7, 8, 9, 10, 11, 12, 13, 20, 21, 22, 23, 24, 25, 28, 29, 30];
                        numCols.forEach(idx => {
                            let sum = 0;
                            secondaryRows.forEach(row => {
                                const val = row[idx];
                                if (typeof val === 'number') sum += val;
                            });
                            totalRow[idx] = sum;
                        });

                        const wsData = [
                            ['MBALA DISTRICT EDUCATION BOARD'],
                            ['DATA ON SECONDARY SCHOOLS AND TEACHERS - 2025'],
                            [''],
                            secondaryHeaders,
                            ...secondaryRows,
                            totalRow
                        ];

                        const ws = XLSX.utils.aoa_to_sheet(wsData);
                        ws['!cols'] = secondaryHeaders.map((h, i) => {
                            let width = 12;
                            if (i < 3) width = 20;
                            if (i > 25) width = 18;
                            return { wch: width };
                        });
                        ws['!merges'] = [
                            { s: { r: 0, c: 0 }, e: { r: 0, c: secondaryHeaders.length - 1 } },
                            { s: { r: 1, c: 0 }, e: { r: 1, c: secondaryHeaders.length - 1 } }
                        ];
                        XLSX.utils.book_append_sheet(wb, ws, 'Secondary Schools');
                    }

                    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                    const blob = new Blob([wbout], { type: 'application/octet-stream' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download =
                    `MBALA_School_Data_${new Date().toISOString().slice(0,10)}.xlsx`;
                    link.click();
                    URL.revokeObjectURL(link.href);
                    showToast('✅ Excel exported with 2 sheets');

                } catch (err) {
                    showToast('❌ Export error: ' + err.message);
                    console.error(err);
                }
            });

            // SUBMIT ENTRY
            document.querySelectorAll('[data-type]').forEach(btn => {
                btn.addEventListener('click', async function() {
                    if (!supabaseClient) {
                        if (!initSupabase()) {
                            showToast('⚠️ Configure Supabase first');
                            return;
                        }
                    }
                    const type = this.dataset.type;
                    let payload = { school_type: type };

                    if (type === 'primary') {
                        payload = {
                            ...payload,
                            school_name: document.getElementById('priName').value.trim() || 'N/A',
                            status: document.getElementById('priStatus').value,
                            distance: parseInt(document.getElementById('priDist').value) || 0,
                            emis: document.getElementById('priEmis').value.trim() || 'N/A',
                            perm_houses: parseInt(document.getElementById('priPermHouses').value) || 0,
                            incomp_houses: parseInt(document.getElementById('priIncompHouses').value) || 0,
                            temp_houses: parseInt(document.getElementById('priTempHouses').value) || 0,
                            perm_class: parseInt(document.getElementById('priPermClass').value) || 0,
                            incomp_class: parseInt(document.getElementById('priIncompClass').value) || 0,
                            temp_class: parseInt(document.getElementById('priTempClass').value) || 0,
                            desks: parseInt(document.getElementById('priDesks').value) || 0,
                            desk_shortfall: parseInt(document.getElementById('priDeskShort').value) || 0,
                            ece1: document.getElementById('priEce1').value || '',
                            ece2: document.getElementById('priEce2').value || '',
                            grade1: document.getElementById('priG1').value || '',
                            grade2_7: document.getElementById('priG2_7').value || '',
                            grade8_9: document.getElementById('priG8_9').value || '',
                            male_teachers: parseInt(document.getElementById('priMale').value) || 0,
                            female_teachers: parseInt(document.getElementById('priFemale').value) || 0,
                            total_teachers: parseInt(document.getElementById('priTotalTeachers').value) || 0,
                            teacher_shortfall: parseInt(document.getElementById('priTeacherShort').value) || 0,
                            comp_func: parseInt(document.getElementById('priCompFunc').value) || 0,
                            comp_dys: parseInt(document.getElementById('priCompDys').value) || 0,
                            power: document.getElementById('priPower').value,
                            water: document.getElementById('priWater').value,
                            vip_latrines: parseInt(document.getElementById('priVip').value) || 0,
                            single_vip: parseInt(document.getElementById('priSingleVip').value) || 0,
                            pit_latrines: parseInt(document.getElementById('priPit').value) || 0,
                            mobile_network: document.getElementById('priMobile').value,
                            specialization: document.getElementById('priSpecialization').value || '',
                            teacher_sample: document.getElementById('priTeacherSample').value || ''
                        };
                    } else {
                        payload = {
                            ...payload,
                            school_name: document.getElementById('secName').value.trim() || 'N/A',
                            status: document.getElementById('secStatus').value,
                            distance: parseInt(document.getElementById('secDist').value) || 0,
                            emis: document.getElementById('secEmis').value.trim() || 'N/A',
                            perm_houses: parseInt(document.getElementById('secPermHouses').value) || 0,
                            incomp_houses: parseInt(document.getElementById('secIncompHouses').value) || 0,
                            temp_houses: parseInt(document.getElementById('secTempHouses').value) || 0,
                            perm_class: parseInt(document.getElementById('secPermClass').value) || 0,
                            incomp_class: parseInt(document.getElementById('secIncompClass').value) || 0,
                            temp_class: parseInt(document.getElementById('secTempClass').value) || 0,
                            desks: parseInt(document.getElementById('secDesks').value) || 0,
                            desk_shortfall: parseInt(document.getElementById('secDeskShort').value) || 0,
                            form1: document.getElementById('secF1').value || '',
                            grade9: document.getElementById('secG9').value || '',
                            grade10_12: document.getElementById('secG10_12').value || '',
                            male_teachers: parseInt(document.getElementById('secMale').value) || 0,
                            female_teachers: parseInt(document.getElementById('secFemale').value) || 0,
                            total_teachers: parseInt(document.getElementById('secTotalTeachers').value) || 0,
                            teacher_shortfall: parseInt(document.getElementById('secTeacherShort').value) || 0,
                            comp_func: parseInt(document.getElementById('secCompFunc').value) || 0,
                            comp_dys: parseInt(document.getElementById('secCompDys').value) || 0,
                            water: document.getElementById('secWater').value,
                            vip_latrines: parseInt(document.getElementById('secVip').value) || 0,
                            single_vip: parseInt(document.getElementById('secSingleVip').value) || 0,
                            pit_latrines: parseInt(document.getElementById('secPit').value) || 0,
                            mobile_network: document.getElementById('secMobile').value,
                            teacher_sample: document.getElementById('secTeacherSample').value || ''
                        };
                    }

                    try {
                        const { data, error } = await supabaseClient.from('schools_data').insert([payload]);
                        if (error) throw error;
                        showToast(`✅ ${type.charAt(0).toUpperCase()+type.slice(1)} saved!`);
                        if (type === 'primary') {
                            document.getElementById('priName').value = '';
                            document.getElementById('priTeacherSample').value = '';
                        } else {
                            document.getElementById('secName').value = '';
                            document.getElementById('secTeacherSample').value = '';
                        }
                    } catch (err) {
                        showToast('❌ Error: ' + err.message);
                        console.error(err);
                    }
                });
            });

            function showToast(msg) {
                toastMsg.innerText = msg;
                toastDiv.style.display = 'flex';
                if (msg.includes('❌') || msg.includes('Error') || msg.includes('⚠️')) {
                    toastDiv.classList.add('error');
                } else {
                    toastDiv.classList.remove('error');
                }
                setTimeout(() => { toastDiv.style.display = 'none'; }, 5000);
            }

            initSupabase();

            if (sessionStorage.getItem('adminLogged') === 'true') {
                if (adminPanel.style.display !== 'none') {
                    adminContent.style.display = 'block';
                    loadAdminData();
                }
            }

            console.log('✅ MBALA app ready');
            console.log('🔒 Admin password: mbala2025');
        })();
    </script>
</body>
</html>
